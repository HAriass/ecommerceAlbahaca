<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
    <link href="/css/pagGenerico.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    
    <div class="divNavBar">
        <nav class="navbar bg-black border-gray-200 bg-black">
            <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
                <a href="/" class="flex items-center space-x-2 rtl:space-x-reverse">
                    <img src="/imgs/albahaca.png" class="w-8 h-8" alt="Logo Albahaca">
                    <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">Albahaca Suplementos</span>
                </a>
                <div class="hidden w-full md:block md:w-auto" id="navbar-default">
                    <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 border md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 dark:bg-black md:dark:bg-black dark:border-gray-700">
                        <li>
                            <a href="/" class="block py-2 px-3 text-white rounded hover:bg-gray-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-400" aria-current="page">Inicio</a>
                        </li>
                        <li sec:authorize="hasAuthority('ADMIN')">
                            <a href="/menu" class="block py-2 px-3 text-white rounded hover:bg-gray-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-400">Menu</a>
                        </li>
                        <li class="relative">
                            <button id="userMenuButton" data-dropdown-toggle="userMenu" class="block py-2 px-3 text-white rounded hover:bg-gray-700">
                                <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" class="w-6 h-6 rounded-full filter invert" alt="User icon">
                            </button>
                            <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-black text-center rounded-md shadow-lg">
                                <ul class="py-2">
                                    <li sec:authorize="isAnonymous()">
                                        <a href="/login" class="block px-2 py-2 text-white">Iniciar Sesión</a>
                                    </li>
                                    <li sec:authorize="isAuthenticated()">
                                        <a href="/logout" class="block px-4 py-2 text-red-400">Cerrar Sesión</a>
                                    </li>
                                </ul>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <main class="flex pr-4">
        <!-- Sidebar con filtro de precio -->
        <aside class="w-1/4 bg-black p-4" style="min-height: 100vh;">
            <h2 class="text-xl text-white font-bold mb-4">Filtros</h2>
            
            <!-- Filtro de Nombre -->
            <div class="mb-4">
                <h3 class="text-lg text-white">Buscar por Nombre</h3>
                <input type="text" id="filtroNombre" class="w-full p-2 mt-2 rounded border border-gray-700 bg-black text-white" placeholder="Escribe el nombre del producto">
            </div>
        
            <!-- Filtro de Precio -->
            <div class="mb-4">
                <h3 class="text-lg text-white">Precio</h3>
                <input type="range" min="0" max="100" value="100" class="w-full" id="precioRange">
                <p class="text-white">Rango de Precio: $<span id="precioMinimo">0</span> - $<span id="precioMaximo">100</span></p>
            </div>
        
            <button id="btnFiltrar" class="bg-blue-500 text-white py-2 px-4 rounded">Aplicar Filtros</button>
        </aside>

        <!-- Contenido Principal -->
        <div class="w-3/4 ml-8 mb-8">
            <h1 class="text-3xl text-center font-bold text-white mt-8 mb-10">Nuestros Productos</h1>
            <div class="tarjeta-categoria">
                <div class="max-w-screen-xl mx-auto">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-6 gap-y-8">
                        <!-- Producto iterado -->
                        <div th:each="producto : ${productos}"
                            class="max-w-xs overflow-hidden bg-white rounded-lg shadow-lg dark:bg-gray-800 border-solid border-2 border-sky-500"
                            data-producto 
                            th:attr="data-precio=${producto.precio}">
                            <div class="px-4 py-2">
                                <!-- Truncamiento del nombre con puntos suspensivos -->
                                <h1 class="text-xl font-bold text-gray-800 uppercase dark:text-white truncate"
                                    th:text="${producto.nombre}" th:attr="title=${producto.nombre}">
                                    Producto
                                </h1>
                                <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
                                    <label class="font-semibold">Stock:</label>
                                    <span th:if="${producto.stock > 0}" th:text="'Disponible: ' + ${producto.stock}"></span>
                                    <span th:if="${producto.stock == 0}">Producto Agotado</span>
                                </p>
                            </div>

                            <img class="object-fit w-full h-48 mt-2" th:src="${producto.imagen}" 
                                th:alt="${producto.nombre}" />

                            <div class="flex items-center justify-between px-4 py-2 bg-gray-900">
                                <h1 class="text-lg font-bold text-white">
                                    $<span th:text="${producto.precio}"></span>
                                </h1>
                                <a th:href="@{/mostrarProducto/{id}(id=${producto.id})}" 
                                class="px-2 py-1 text-xs font-semibold text-gray-900 uppercase transition-colors duration-300 transform bg-white rounded hover:bg-gray-200 focus:bg-gray-400 focus:outline-none">
                                    Ver Producto
                                </a>
                            </div>
                        </div>

                        
                        
                        <!-- Fin de producto -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script para calcular rango de precios y filtrar -->
    <script>
        // Elementos del DOM
        const rangoPrecio = document.getElementById("precioRange");
        const precioMinimo = document.getElementById("precioMinimo");
        const precioMaximo = document.getElementById("precioMaximo");
        const filtroNombre = document.getElementById("filtroNombre");
        const btnFiltrar = document.getElementById("btnFiltrar");
        const productos = document.querySelectorAll("[data-producto]");

        // Obtener precios mínimo y máximo de los productos
        const precios = Array.from(productos).map(producto =>
            parseFloat(producto.getAttribute("data-precio"))
        );
        const minPrecio = Math.min(...precios);
        const maxPrecio = Math.max(...precios);

        // Configurar valores iniciales del rango de precios
        rangoPrecio.min = minPrecio;
        rangoPrecio.max = maxPrecio;
        rangoPrecio.value = maxPrecio;
        precioMinimo.textContent = minPrecio.toFixed(2);
        precioMaximo.textContent = maxPrecio.toFixed(2);

        // Actualizar rango dinámicamente
        rangoPrecio.addEventListener("input", () => {
            precioMaximo.textContent = parseFloat(rangoPrecio.value).toFixed(2);
        });

        // Filtrar productos al presionar el botón
        btnFiltrar.addEventListener("click", () => {
            const precioMaximoFiltro = parseFloat(rangoPrecio.value);
            const textoFiltro = filtroNombre.value.toLowerCase();

            productos.forEach((producto) => {
                const precio = parseFloat(producto.getAttribute("data-precio"));
                const nombre = producto.querySelector("h1").textContent.toLowerCase();

                // Mostrar u ocultar producto según filtros
                if (precio <= precioMaximoFiltro && nombre.includes(textoFiltro)) {
                    producto.style.display = ""; // Mostrar producto
                } else {
                    producto.style.display = "none"; // Ocultar producto
                }
            });
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
</body>
</html>
