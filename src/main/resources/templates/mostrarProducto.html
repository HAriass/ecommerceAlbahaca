<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
    <link href="/css/pagGenerico.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script> <!-- Agregar Axios -->
</head>
<body>
    <div class="divNavBar">
        <nav class="navbar bg-black border-gray-200">
            <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
                <a href="/" class="flex items-center space-x-2 rtl:space-x-reverse">
                    <img src="/imgs/albahaca.png" class="w-8 h-8" alt="Logo Albahaca">
                    <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">Albahaca Suplementos</span>
                </a>
                <div class="hidden w-full md:block md:w-auto" id="navbar-default">
                    <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 border md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 dark:bg-black md:dark:bg-black dark:border-gray-700">
                        <li>
                            <a href="/" class="block py-2 px-3 text-white rounded hover:bg-gray-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-400" aria-current="page">Inicio</a>
                        </li>
                        <li sec:authorize="hasAuthority('ADMIN')">
                            <a href="/menu" class="block py-2 px-3 text-white rounded hover:bg-gray-700 md:hover:bg-transparent md:border-0 md:hover:text-blue-400">Menú</a>
                        </li>
                        <li class="relative">
                            <button id="userMenuButton" data-dropdown-toggle="userMenu" class="block py-2 px-3 text-white rounded hover:bg-gray-700">
                                <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" class="w-6 h-6 rounded-full filter invert" alt="User icon">
                            </button>
                            <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-black text-center rounded-md shadow-lg">
                                <ul class="py-2">
                                    <li sec:authorize="isAnonymous()">
                                        <a href="/login" class="block px-2 py-2 text-white">Iniciar Sesión</a>
                                    </li>
                                    <li sec:authorize="isAuthenticated()">
                                        <a href="/logout" class="block px-4 py-2 text-red-400">Cerrar Sesión</a>
                                    </li>
                                </ul>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <div class="content container mx-auto p-4">
        <h1 class="text-3xl text-white font-bold mb-6 text-center">Detalles del Producto</h1>
    
        <div th:if="${producto != null}" class="bg-black shadow-md rounded-lg p-4 max-w-md mx-auto">
            <img th:src="${producto.imagen}" 
                 alt="${producto.nombre}" 
                 class="rounded-t-lg w-full object-fit h-48 mb-3" />
            <div class="p-3">
                <p class="text-base mb-2 text-gray-400 truncate">
                    <span class="font-semibold">Nombre: </span> 
                    <span th:text="${producto.nombre}" class="text-white"></span>
                </p>
                <p class="text-base mb-2 text-gray-400 truncate">
                    <span class="font-semibold">Descripción: </span> 
                    <span 
                        th:text="${producto.descripcion}" 
                        th:attr="title=${producto.descripcion}" 
                        class="text-white">
                    </span>
                </p>                               
                <p class="text-base mb-2 text-gray-400">
                    <span class="font-semibold">Stock: </span> 
                    <span th:text="${producto.stock}" class="text-white"></span>
                </p>
                <p class="text-base mb-3 text-gray-400">
                    <span class="font-semibold">Precio: $</span>
                    <span th:text="${producto.precio}" class="text-green-300 font-bold"></span>
                </p>
            </div>
        
            <form id="addToCartForm" th:action="@{/addToCart}" method="post" sec:authorize="hasAuthority('USER')" class="space-y-3 mt-2">
                <input type="hidden" name="productoId" th:value="${producto.id}" id="productoId" />
                
                <div th:if="${producto.stock > 0}">
                    <div class="flex flex-col gap-2">
                        <label class="block text-gray-400 font-semibold">Cantidad:</label>
                        <input type="number" name="cantidad" min="1" value="1" id="cantidad" 
                               th:disabled="${producto.stock == 0}" 
                               class="w-20 p-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
            
                    <input type="submit" value="Agregar al Carrito" 
                           th:disabled="${producto.stock == 0}" 
                           class="w-full mt-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-1.5 px-3 rounded-md transition duration-300 cursor-pointer">
                </div>
            </form>            
        
            <div th:if="${!#authorization.expression('hasAuthority(''USER'')')}">
                <p class="text-red-500">Debes iniciar sesión como cliente para agregar productos al carrito.</p>
            </div>
            
            <div th:if="${producto.stock == 0}">
                <p class="text-red-500">Producto Agotado</p>
            </div>
        </div>
        
    
        <div th:if="${producto == null}" class="text-center text-red-500">
            <p>No se encontró el producto.</p>
        </div>
    </div> 
    
</div>

    




    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>

    <script>
        document.getElementById("addToCartForm").addEventListener("submit", function(event) {
            const cantidad = parseInt(document.getElementById("cantidad").value);
            const stock = parseInt([[${producto.stock}]]);

            if (cantidad > stock) {
                event.preventDefault(); // Evita el envío del formulario
                alert("La cantidad no puede exceder el stock disponible.");
            }
        });
    </script>

</body>
</html>
